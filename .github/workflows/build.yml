name: Build StatusHUD

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    env:
      VINTAGE_STORY: C:\vs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Show .NET Info
        run: dotnet --info

      - name: Build
        run: dotnet build statushud.sln -c Release
